<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f4c4a"><title>Review Admin | A TO Z Cleaner</title><style>
:root{--teal:#0f4c4a;--mist:#eef5f3;--line:#dce8e5}*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:var(--mist);font-family:Arial,sans-serif;color:#183331}.wrap{max-width:850px;margin:auto}.panel,.review{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0}h1,h2{color:var(--teal)}label{display:block;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #cbdad6;border-radius:9px}button{padding:10px 17px;border:0;border-radius:9px;cursor:pointer;font-weight:700;margin:6px 6px 0 0}.primary,.approve{background:var(--teal);color:white}.reject{background:#a83232;color:white}.muted{color:#647875}#status{font-weight:600}</style></head>
<body><main class="wrap"><h1>A TO Z Cleaner — Review Admin</h1><section class="panel" id="loginPanel"><h2>Admin Login</h2><form id="loginForm"><label for="email">Admin email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary">Login</button></form></section><section class="panel" id="dashboard" hidden><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2>Review Requests</h2><button id="logout" type="button">Logout</button></div><p id="status" role="status"></p><div id="pendingList">Loading...</div></section></main>
<script type="module" src="admin.js"></script></body></html>
